name: Chatwoot Smart Router 24/7 Cloud Worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: chatwoot-cloud-router-24-7
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  cloud-router-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run 24/7 Chatwoot Smart Router & Hugging Face Cloud Sync Worker
        env:
          CLOUD_WORKER_MAX_SECONDS: "20400"
          CLOUD_WORKER_INTERVAL: "35"
        run: |
          python Backend/cloud_worker.py
