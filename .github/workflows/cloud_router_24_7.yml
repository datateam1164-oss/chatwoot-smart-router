name: Chatwoot Smart Router 24/7 Cloud Worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: chatwoot-cloud-router-24-7
  cancel-in-progress: true

jobs:
  cloud-router-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cloud worker disabled (Local Mode Active)
        run: |
          echo "Cloud worker is disabled because local code mode is active."
