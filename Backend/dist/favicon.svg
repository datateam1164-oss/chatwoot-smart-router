<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#B45F3A" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="2" />

  <!-- Routing Paths from Source Hub to 3 Target Nodes -->
  <path d="M 18 32 C 28 32, 28 16, 40 16" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 18 32 L 42 32" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 18 32 C 28 32, 28 48, 40 48" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Arrowheads -->
  <polyline points="37,11 43,16 37,21" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="39,27 45,32 39,37" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="37,43 43,48 37,53" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Source Chat / Hub Node -->
  <circle cx="15" cy="32" r="6.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2.5" />

  <!-- Destination Agent Nodes -->
  <circle cx="50" cy="16" r="4.5" fill="#34D399" stroke="#ECFDF5" stroke-width="2" />
  <circle cx="52" cy="32" r="4.5" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2" />
  <circle cx="50" cy="48" r="4.5" fill="#F472B6" stroke="#FCE7F3" stroke-width="2" />
</svg>
