services:
  - type: web
    name: chatwoot-smart-router-engine
    env: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: AUTO_BOOTSTRAP
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.8"
